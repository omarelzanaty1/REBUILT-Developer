# Publishes the DEVELOPMENT (preview) site of REBUILT to GitHub Pages of THIS repository — nothing else.
#
#   Developer (push to main) -> GitHub Actions -> Preview website -> your review -> your approval -> Stable
#
#   test    unit (auth + strict-mode) + repository-guard + release-script tests; a failing test stops everything after it
#   build   assembles the site from the files listed in scripts/site-files.txt ONLY (never supabase/, tests/,
#           docs/, scripts/, .github/), stamps this commit onto every script / stylesheet address of the published
#           index.html (scripts/stamp-build.js: one deployment's files can never be mixed with another's by the
#           browser cache), checks it, and uploads it as the Pages artifact
#   deploy  publishes that artifact to this repository's own Pages site (needs the one-time setting below)
#   verify  fetches the published address and checks the build marker (which now carries this commit), that the files
#           of THIS commit are the ones served, and that nothing private is served
#
# This workflow cannot reach the official site: that lives in another repository and is only changed by
# scripts/release.sh, after explicit approval (docs/ENVIRONMENTS.md). The token below is limited to this repository.
#
# One-time manual setting (a workflow file cannot do it): Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# Until it is set, `deploy` fails with "Get Pages site failed ... Not Found"; once it is set, use
# Actions -> (that run) -> "Re-run failed jobs": the already-built artifact is published.
name: Deploy development site (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unit tests
        run: node tests/auth.test.js
      - name: Strict-mode unit tests (a failing backend is never hidden; Stable's behaviour is pinned; rows come back in a stable order)
        run: node tests/strict.test.js
      - name: Repository guards (no official domain here, only site files are published, no secrets)
        run: node tests/dev-repo.test.js
      - name: Release-script tests (local throw-away repositories)
        run: node tests/release.test.js
      - name: Unit tests — translations (every key in every language, no text left in the code, dictionaries checked and re-fetched before the first screen)
        run: node tests/i18n.test.js
      - name: Unit tests — build stamp (one deployment's files stay together in the browser cache)
        run: node tests/stamp-build.test.js

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      marker: ${{ steps.site.outputs.marker }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site (only what the browser needs)
        id: site
        run: |
          mkdir _site
          grep -v '^[[:space:]]*\(#\|$\)' scripts/site-files.txt | xargs -I{} cp -r {} _site/
          touch _site/.nojekyll
          test ! -e _site/CNAME   # the official domain must never be published from here
          for d in supabase tests docs scripts .github; do test ! -e "_site/$d" || { echo "::error::_site/$d must not be published"; exit 1; }; done
          node scripts/stamp-build.js _site "${GITHUB_SHA::7}"
          marker="$(sed -n 's/.*<meta name="rebuilt-build" content="\([^"]*\)".*/\1/p' _site/index.html | head -n 1)"
          test -n "$marker" || { echo "::error::no build marker in index.html"; exit 1; }
          echo "marker=$marker" >> "$GITHUB_OUTPUT"
          echo "Publishing build marker: $marker"
          find _site -type f | sort | head -n 80
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: The published address serves this build, and nothing private
        env:
          MARKER: ${{ needs.build.outputs.marker }}
        run: |
          URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          echo "Checking $URL for build marker: $MARKER"
          ok=0
          for i in $(seq 1 12); do
            got="$(curl -fsS -H 'Cache-Control: no-cache' "$URL?v=$GITHUB_SHA$i" | sed -n 's/.*<meta name="rebuilt-build" content="\([^"]*\)".*/\1/p' | head -n 1 || true)"
            echo "attempt $i: served marker = '${got}'"
            if [ "$got" = "$MARKER" ]; then ok=1; break; fi
            sleep 10
          done
          [ "$ok" = 1 ] || { echo "::error::$URL does not serve build marker '$MARKER'"; exit 1; }
          SHA7="${GITHUB_SHA::7}"
          html="$(curl -fsS -H 'Cache-Control: no-cache' "$URL?v=$GITHUB_SHA")"
          echo "$html" | grep -q "js/i18n.js?v=$SHA7" || { echo "::error::the served index.html does not reference this commit's files (js/i18n.js?v=$SHA7)"; exit 1; }
          for f in js/i18n.js js/app.js js/locales/en/common.js js/locales/ar/common.js css/tokens.css; do
            code="$(curl -s -o /dev/null -w '%{http_code}' "$URL$f?v=$SHA7")"
            echo "GET /$f?v=$SHA7 -> $code"
            [ "$code" = "200" ] || { echo "::error::/$f must be served (got $code)"; exit 1; }
          done
          for p in CNAME supabase/README.md tests/auth.test.js docs/ENVIRONMENTS.md scripts/release.sh .github/workflows/pages.yml; do
            code="$(curl -s -o /dev/null -w '%{http_code}' "$URL$p")"
            echo "GET /$p -> $code"
            [ "$code" = "404" ] || { echo "::error::/$p must not be served (got $code)"; exit 1; }
          done
          curl -fsS "${URL}js/supabaseClient.js" | grep -q 'development:' || { echo "::error::supabaseClient.js on the preview has no development profile"; exit 1; }
          echo "supabaseClient.js: development profile present"
