  <!-- Snapshot of the landing URL, taken BEFORE supabase-js consumes the hash.
       Lets the app recognise an old password-recovery link (…#access_token=…&type=recovery),
       an expired-link error, or the way back from Google (js/auth.js → parseAuthReturn).
       Only the raw strings are kept; nothing is read from them here.
       Error parameters (…#error=access_denied…) are then taken out of the address: supabase-js treats
       "a sign-in through the URL failed" as a reason to sign the current user OUT, and a cancelled
       "link Google" must never do that. The app shows the message itself from the snapshot. -->
  <script>
    (function () {
      var w = window, loc = w.location;
      w.__REBUILT_BOOT_URL = { hash: loc.hash || "", search: loc.search || "" };
      try {
        var q = new URLSearchParams(loc.search), h = new URLSearchParams((loc.hash || "").replace(/^#/, ""));
        var has = function (p) { return p.has("error") || p.has("error_code") || p.has("error_description"); };
        if (has(q) || has(h)) {
          ["error", "error_code", "error_description"].forEach(function (k) { q.delete(k); h.delete(k); });
          var qs = q.toString(), hs = h.toString();
          w.history.replaceState(null, "", loc.pathname + (qs ? "?" + qs : "") + (hs ? "#" + hs : ""));
        }
      } catch (e) { /* the snapshot above is what matters */ }
    })();
  </script>

  <!-- Language + theme, applied BEFORE the first paint so the page never flashes in the wrong direction or colours.
       Same key and rules as js/prefs.js, js/i18n.js and js/theme.js (which take over once the app has loaded):
       lang "ar" (default) | "en"; theme "dark" (default) | "light" | "system" (follows the device). -->
  <script>
    /* rebuilt-prefs-boot */
    (function () {
      try {
        var d = document.documentElement, p = {};
        try { p = JSON.parse(window.localStorage.getItem("rebuilt_prefs_v1") || "{}") || {}; } catch (e) { p = {}; }
        var lang = p.lang === "en" ? "en" : "ar";
        d.setAttribute("lang", lang); d.setAttribute("dir", lang === "en" ? "ltr" : "rtl"); d.setAttribute("data-lang", lang);
        var pref = p.theme === "light" || p.theme === "system" ? p.theme : "dark";
        var light = pref === "light" || (pref === "system" && window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches);
        d.setAttribute("data-theme", light ? "light" : "dark"); d.setAttribute("data-theme-pref", pref);
        var chrome = document.querySelector('meta[name="theme-color"]'); if (chrome) chrome.setAttribute("content", light ? "#F6F4EC" : "#201F19");
        var scheme = document.querySelector('meta[name="color-scheme"]'); if (scheme) scheme.setAttribute("content", light ? "light" : "dark");
      } catch (e) { /* the defaults in the markup apply: Arabic, dark */ }
    })();
  </script>
